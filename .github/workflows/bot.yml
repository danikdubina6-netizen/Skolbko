name: Run Telegram Age Bot

on:
  workflow_dispatch: # Ручной запуск кнопкой в GitHub
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *' # Автоматический перезапуск каждые 5 часов

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python main.py
      
